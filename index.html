<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lechner LAN — Wallpaper Gallery</title>
<style>
  :root {
    --bg: #0c0d12;
    --bg2: #15171f;
    --ink: #f4f5f7;
    --muted: #8b8f9a;
    --accent: #f5c518;
    --border: #23262e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    padding: 32px 24px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #15171f 0%, #0c0d12 100%);
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-weight: 800;
  }
  h1 .accent { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .filters {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 16px; border-bottom: 1px solid var(--border); background: var(--bg2);
    position: sticky; top: 0; z-index: 10;
  }
  .filter-btn {
    background: transparent; color: var(--ink); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    padding: 18px;
    max-width: 1600px; margin: 0 auto;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    aspect-ratio: 16/9;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    background: linear-gradient(0deg, rgba(0,0,0,.85), transparent);
    display: flex; justify-content: space-between; align-items: end; gap: 8px;
  }
  .card .meta .t { font-size: 13px; font-weight: 600; }
  .card .meta .c { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  footer { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
  footer a { color: var(--accent); text-decoration: none; }
  .download-all {
    display: inline-block;
    background: var(--accent);
    color: #111;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    margin-top: 14px;
    transition: transform .15s, box-shadow .15s;
  }
  .download-all:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(245,197,24,.3); }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .lightbox .lb-meta { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: var(--ink); }
  .lightbox .lb-meta .lb-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .lightbox .lb-meta a { color: var(--accent); margin: 0 10px; font-size: 13px; text-decoration: none; }
  .lightbox .lb-close { position: absolute; top: 16px; right: 20px; background: transparent; border: none; color: var(--ink); font-size: 28px; cursor: pointer; }
  .lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 22px; }
  .lightbox .lb-prev { left: 16px; }
  .lightbox .lb-next { right: 16px; }
  .lightbox .lb-nav:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body>
<header>
  <h1>Lechner <span class="accent">LAN</span></h1>
  <p id="count">Loading…</p>
  <a class="download-all" href="lechner-lan-wallpapers.zip" download>⬇ Download all (JPG · 39 MB)</a>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<footer>
  Generated wallpapers · 1920×1080 · click any tile to view full size · <a href="https://github.com/nic-dryrun/lechner-lan" target="_blank" rel="noopener">repo</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  <div class="lb-meta">
    <div class="lb-title" id="lbTitle"></div>
    <div>
      <a id="lbDownload" download>Download JPG (1920×1080)</a>
      <a id="lbDownloadPng" download>Download PNG</a>
      <a id="lbOpen" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </div>
</div>

<script>
let items = [];
let activeFilter = "All";
let activeIndex = -1;

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
const lbDownload = document.getElementById("lbDownload");
const lbDownloadPng = document.getElementById("lbDownloadPng");
const lbOpen = document.getElementById("lbOpen");

fetch("gallery.json").then(r => r.json()).then(data => {
  items = data;
  buildFilters();
  render();
});

function buildFilters() {
  const cats = ["All", ...Array.from(new Set(items.map(i => i.category)))];
  filtersEl.innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === activeFilter ? "active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
  filtersEl.querySelectorAll(".filter-btn").forEach(b => {
    b.addEventListener("click", () => {
      activeFilter = b.dataset.cat;
      buildFilters();
      render();
    });
  });
}

function visibleItems() {
  return activeFilter === "All" ? items : items.filter(i => i.category === activeFilter);
}

function render() {
  const list = visibleItems();
  countEl.textContent = `${list.length} wallpaper${list.length === 1 ? "" : "s"}`;
  grid.innerHTML = list.map((item, idx) => `
    <div class="card" data-idx="${idx}">
      <img loading="lazy" src="${item.thumb}" alt="${item.title}">
      <div class="meta">
        <div class="t">${item.title}</div>
        <div class="c">${item.category}</div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => openLightbox(parseInt(c.dataset.idx, 10)));
  });
}

function openLightbox(idx) {
  const list = visibleItems();
  if (idx < 0 || idx >= list.length) return;
  activeIndex = idx;
  const item = list[idx];
  lbImg.src = item.full;
  lbImg.alt = item.title;
  lbTitle.textContent = `${item.title} · ${item.category}`;
  lbDownload.href = item.jpg;
  lbDownload.setAttribute("download", item.jpg_filename);
  lbDownloadPng.href = item.full;
  lbDownloadPng.setAttribute("download", item.filename);
  lbOpen.href = item.full;
  lb.classList.add("open");
}
function closeLightbox() { lb.classList.remove("open"); lbImg.src = ""; }
function navLightbox(delta) {
  const list = visibleItems();
  if (!list.length) return;
  activeIndex = (activeIndex + delta + list.length) % list.length;
  openLightbox(activeIndex);
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => navLightbox(-1));
document.getElementById("lbNext").addEventListener("click", () => navLightbox(1));
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") navLightbox(-1);
  if (e.key === "ArrowRight") navLightbox(1);
});
</script>
</body>
</html>
