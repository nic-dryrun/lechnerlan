<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lechner LAN — Wallpaper Gallery</title>
<style>
  :root {
    --bg: #0a1020;
    --panel: #060b16;
    --ink: #ffffff;
    --muted: #93a4c8;
    --yellow: #22d3ee;
    --red: #3b82f6;
    --blue: #a855f7;
    --border: #ffffff;
    --card: #101828;
    --halftone: radial-gradient(circle, rgba(34,211,238,0.09) 1px, transparent 1.5px);
    --head-font: 'Arial Black','Impact',sans-serif;
    --body-font: 'Courier New',monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    background-image: var(--halftone);
    background-size: 12px 12px;
    color: var(--ink);
    font-family: var(--body-font);
  }
  .site-nav {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 3px solid var(--border);
    background: var(--panel);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
  }
  .site-nav a {
    text-decoration: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 900;
    font-family: var(--head-font);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 16px;
    border: 2px solid transparent;
    border-radius: 4px;
    transition: color .15s, border-color .15s, box-shadow .15s;
  }
  .site-nav a:hover { color: var(--yellow); border-color: var(--yellow); }
  .site-nav a.active {
    color: var(--yellow);
    border-color: var(--yellow);
    background: rgba(34,211,238,0.08);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
    border-bottom: 3px solid var(--border);
    background: var(--panel);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 4vw, 48px);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 900;
    font-family: var(--head-font);
    color: var(--yellow);
    text-shadow:
      0 0 8px rgba(34,211,238,0.6),
      0 0 24px rgba(168,85,247,0.4),
      3px 3px 0 rgba(59,130,246,0.7);
  }
  h1 .accent { color: var(--blue); }
  header p { margin: 0; color: var(--muted); font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .filters {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 16px;
    border-bottom: 2px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4);
  }
  .filter-btn {
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--border);
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--body-font);
    cursor: pointer;
    transition: border-color .15s, color .15s, box-shadow .15s;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .filter-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .filter-btn.active {
    background: var(--yellow);
    color: #111;
    border-color: var(--border);
    font-weight: 900;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    padding: 18px;
    max-width: 1600px; margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s, border-color .15s;
    aspect-ratio: 16/9;
    position: relative;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
  }
  .card:hover {
    transform: translate(-2px, -2px);
    border-color: var(--yellow);
    box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    background: linear-gradient(0deg, rgba(0,0,0,.85), transparent);
    display: flex; justify-content: space-between; align-items: end; gap: 8px;
  }
  .card .meta .t { font-size: 13px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card .meta .c { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-family: var(--body-font); }
  footer {
    padding: 24px; text-align: center; color: var(--muted); font-size: 13px;
    border-top: 3px solid var(--border);
    background: var(--panel);
    font-family: var(--body-font);
  }
  footer a { color: var(--yellow); text-decoration: none; }
  .download-all {
    display: inline-block;
    background: var(--yellow);
    color: #111;
    border: 3px solid var(--border);
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 900;
    font-family: var(--head-font);
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    text-decoration: none;
    margin-top: 14px;
    transition: transform .1s, box-shadow .1s;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.6);
  }
  .download-all:hover {
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 rgba(0,0,0,0.6);
  }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 120px); border: 3px solid var(--border); border-radius: 4px; box-shadow: 6px 6px 0 rgba(0,0,0,0.6); }
  .lightbox .lb-meta { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: var(--ink); }
  .lightbox .lb-meta .lb-title { font-size: 15px; font-weight: 900; font-family: var(--head-font); text-transform: uppercase; margin-bottom: 4px; }
  .lightbox .lb-meta a { color: var(--yellow); margin: 0 10px; font-size: 13px; text-decoration: none; font-family: var(--body-font); }
  .lightbox .lb-close { position: absolute; top: 16px; right: 20px; background: transparent; border: 2px solid var(--border); color: var(--ink); font-size: 28px; cursor: pointer; width: 44px; height: 44px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .lightbox .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: var(--card); color: var(--ink); border: 2px solid var(--border); width: 44px; height: 44px; border-radius: 4px; cursor: pointer; font-size: 22px; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); }
  .lightbox .lb-prev { left: 16px; }
  .lightbox .lb-next { right: 16px; }
  .lightbox .lb-nav:hover { background: var(--card); border-color: var(--yellow); color: var(--yellow); }
</style>
</head>
<body>
<div class="site-nav">
  <a href="../">Bracket Tracker</a>
  <a href="." class="active">Wallpaper Gallery</a>
</div>
<header>
  <h1>Lechner <span class="accent">LAN</span></h1>
  <p id="count">Loading…</p>
  <a class="download-all" href="../lechner-lan-wallpapers.zip" download>⬇ Download all (JPG · 39 MB)</a>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<footer>
  Generated wallpapers · 1920×1080 · click any tile to view full size · <a href="https://github.com/nic-dryrun/lechner-lan" target="_blank" rel="noopener">repo</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
  <div class="lb-meta">
    <div class="lb-title" id="lbTitle"></div>
    <div>
      <a id="lbDownload" download>Download JPG (1920×1080)</a>
      <a id="lbDownloadPng" download>Download PNG</a>
      <a id="lbOpen" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </div>
</div>

<script>
let items = [];
let activeFilter = "All";
let activeIndex = -1;

const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
const lbDownload = document.getElementById("lbDownload");
const lbDownloadPng = document.getElementById("lbDownloadPng");
const lbOpen = document.getElementById("lbOpen");

fetch("../gallery.json").then(r => r.json()).then(data => {
  items = data;
  buildFilters();
  render();
});

function buildFilters() {
  const cats = ["All", ...Array.from(new Set(items.map(i => i.category)))];
  filtersEl.innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === activeFilter ? "active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
  filtersEl.querySelectorAll(".filter-btn").forEach(b => {
    b.addEventListener("click", () => {
      activeFilter = b.dataset.cat;
      buildFilters();
      render();
    });
  });
}

function visibleItems() {
  return activeFilter === "All" ? items : items.filter(i => i.category === activeFilter);
}

function render() {
  const list = visibleItems();
  countEl.textContent = `${list.length} wallpaper${list.length === 1 ? "" : "s"}`;
  grid.innerHTML = list.map((item, idx) => `
    <div class="card" data-idx="${idx}">
      <img loading="lazy" src="../${item.thumb}" alt="${item.title}">
      <div class="meta">
        <div class="t">${item.title}</div>
        <div class="c">${item.category}</div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => openLightbox(parseInt(c.dataset.idx, 10)));
  });
}

function openLightbox(idx) {
  const list = visibleItems();
  if (idx < 0 || idx >= list.length) return;
  activeIndex = idx;
  const item = list[idx];
  lbImg.src = `../${item.full}`;
  lbImg.alt = item.title;
  lbTitle.textContent = `${item.title} · ${item.category}`;
  lbDownload.href = `../${item.jpg}`;
  lbDownload.setAttribute("download", item.jpg_filename);
  lbDownloadPng.href = `../${item.full}`;
  lbDownloadPng.setAttribute("download", item.filename);
  lbOpen.href = `../${item.full}`;
  lb.classList.add("open");
}
function closeLightbox() { lb.classList.remove("open"); lbImg.src = ""; }
function navLightbox(delta) {
  const list = visibleItems();
  if (!list.length) return;
  activeIndex = (activeIndex + delta + list.length) % list.length;
  openLightbox(activeIndex);
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => navLightbox(-1));
document.getElementById("lbNext").addEventListener("click", () => navLightbox(1));
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") navLightbox(-1);
  if (e.key === "ArrowRight") navLightbox(1);
});
</script>
</body>
</html>
